
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WEHRE IS MY CAR</title>
<meta name="apple-mobile-web-app-title" content="내차어디">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#477dff">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2">
<link rel="icon" type="image/png" href="/apple-touch-icon.png?v=2">
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#111216;color:white;
 font-family:-apple-system,sans-serif
}
main{max-width:480px;margin:auto;padding:20px 15px}
h1{font-size:25px;margin:0}
p{color:#999;font-size:13px}
.card{
 background:#22252d;border-radius:18px;
 padding:20px;text-align:center;margin:20px 0
}
#preview{font-size:35px;font-weight:800;margin:10px 0}
h3{font-size:14px;color:#aaa;margin:22px 0 10px}
.grid{display:grid;gap:6px}
#floors{grid-template-columns:repeat(7,minmax(0,1fr))}
#zones{grid-template-columns:repeat(8,minmax(0,1fr))}
#keys{grid-template-columns:repeat(3,1fr)}
button{
 background:#292d36;color:white;
 border:1px solid #414550;border-radius:10px;
 min-height:50px;font-size:17px;
 font-weight:600;cursor:pointer
}
#floors button,#zones button{
 font-size:12px;min-height:43px;padding:0
}
#keys button{font-size:23px;min-height:55px}
button.active{background:#477dff;border-color:#477dff}
#save{
 width:100%;height:60px;background:#477dff;
 border:0;font-size:18px;margin-top:20px
}
#last{font-size:29px;font-weight:bold;margin:10px 0}
small{color:#999}
</style>
</head>
<body>
<main>
<h1>WEHRE IS MY CAR</h1>
<p>주차 위치를 간편하게 기록하세요.</p>

<div class="card">
<small>현재 선택 위치</small>
<div id="preview">층 · 구역 · 번호</div>
</div>

<h3>01. 주차 층</h3>
<div id="floors" class="grid"></div>

<h3>02. 주차 구역</h3>
<div id="zones" class="grid"></div>

<h3>03. 주차 번호</h3>
<div id="keys" class="grid"></div>

<button id="save">주차 위치 저장</button>

<div class="card">
<small>마지막 주차 위치</small>
<div id="last">기록 없음</div>
<small id="time"></small>
</div>
</main>

<script>
let floor="",zone="",number="";
const el=id=>document.getElementById(id);

function create(id,values,callback){
 const box=el(id);
 values.forEach(value=>{
  const button=document.createElement("button");
  button.textContent=value;
  button.onclick=()=>{
   callback(value);
   if(id!=="keys"){
    [...box.children].forEach(b=>
     b.classList.toggle("active",b===button)
    );
   }
   update();
  };
  box.appendChild(button);
 });
}

create("floors",
 ["B1","B2","B3","B4","B5","B6","지상"],
 v=>floor=v);

create("zones",
 ["A","B","C","D","E","F","G","H"],
 v=>zone=v);

create("keys",
 ["1","2","3","4","5","6","7","8","9","←","0","초기화"],
 v=>{
  if(v==="초기화")number="";
  else if(v==="←")number=number.slice(0,-1);
  else if(number.length<2)number+=v;
 });

function update(){
 el("preview").textContent=
 `${floor||"층"} · ${zone||"구역"}${number||"--"}`;
}

function load(){
 try{
  const data=JSON.parse(localStorage.getItem("parkpin"));
  if(data){
   el("last").textContent=data.place;
   el("time").textContent=data.time;
  }
 }catch(e){}
}

el("save").onclick=()=>{
 if(!floor||!zone||!number){
  alert("층, 구역, 번호를 모두 선택하세요.");
  return;
 }
 const place=`${floor} · ${zone}${number.padStart(2,"0")}`;
 const time=new Date().toLocaleString("ko-KR");
 try{
  localStorage.setItem("parkpin",JSON.stringify({place,time}));
  load();
  alert("저장 완료: "+place);
 }catch(e){
  alert("현재 환경에서 저장할 수 없습니다.");
 }
};

load();
</script>
</body>
</html>
