
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>WHERE IS MY CAR</title>
<meta name="apple-mobile-web-app-title" content="내차어디">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#477dff">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2">
<link rel="icon" type="image/png" href="/apple-touch-icon.png?v=2">
<style>
*{box-sizing:border-box}
html{background:#111216}
body{margin:0;background:#111216;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif}
main{width:100%;max-width:480px;margin:auto;padding:14px 14px calc(12px + env(safe-area-inset-bottom));}
h1{font-size:21px;line-height:1.2;letter-spacing:-.4px;margin:0 0 10px}
small{font-size:11px;color:#9ca1ae}
.last-card{background:#22252d;border-radius:14px;padding:12px 15px;display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:73px}
#last{font-size:29px;font-weight:800;line-height:1.15;white-space:nowrap;text-align:right}
#time{display:block;font-size:10px;color:#999;margin-top:4px;text-align:right}
.current{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:11px 0 5px;padding:8px 2px;min-height:38px}
#preview{font-size:20px;font-weight:750;text-align:right}
h3{font-size:12px;color:#b6bac5;margin:11px 0 6px;font-weight:650}
.grid{display:grid;gap:5px}
#floor-controls{display:grid;grid-template-columns:2fr 6fr;gap:8px}
#floor-type{grid-template-columns:repeat(2,minmax(0,1fr))}
#floors{grid-template-columns:repeat(7,minmax(0,1fr))}
#zones{grid-template-columns:repeat(9,minmax(0,1fr))}
#keys{grid-template-columns:repeat(3,minmax(0,1fr))}
button{appearance:none;-webkit-appearance:none;touch-action:manipulation;background:#292d36;color:#fff;border:1px solid #414550;border-radius:9px;font-weight:650;cursor:pointer}
#floor-type button,#floors button,#zones button{font-size:12px;min-height:39px;padding:0}
#keys button{font-size:21px;min-height:46px}
#keys button:last-child{font-size:14px}
button.active{background:#477dff;border-color:#477dff}
#floor-type button{background:#fff;border-color:#fff;color:#20232b}
#floor-type button.active{background:#168568;border-color:#66ddbd;color:#fff;box-shadow:inset 0 0 0 1px #66ddbd}
#save{display:block;width:100%;min-height:51px;background:#477dff;border:0;font-size:17px;margin-top:12px;border-radius:12px}
@media(max-height:720px){
main{padding-top:9px}
h1{font-size:19px;margin-bottom:7px}
.last-card{min-height:62px;padding:8px 13px}
#last{font-size:26px}
.current{min-height:31px;margin:7px 0 3px;padding:5px 2px}
h3{margin:8px 0 5px}
#floor-type button,#floors button,#zones button{min-height:36px}
#keys button{min-height:41px}
#save{min-height:46px;margin-top:9px}
}
</style>
</head>
<body>
<main>
<h1>WHERE IS MY CAR</h1>

<div class="last-card" aria-label="마지막 주차 위치">
 <div><small>마지막 주차 위치</small></div>
 <div><div id="last">기록 없음</div><small id="time"></small></div>
</div>

<div class="current">
 <small>현재 선택</small>
 <div id="preview" aria-live="polite">층을 선택하세요</div>
</div>

<h3>01. 주차 층 (필수)</h3>
<div id="floor-controls">
 <div id="floor-type" class="grid" aria-label="지하 또는 지상"></div>
 <div id="floors" class="grid" aria-label="층 번호"></div>
</div>

<h3>02. 주차 구역 (선택)</h3>
<div id="zones" class="grid"></div>

<h3>03. 주차 번호 (선택)</h3>
<div id="keys" class="grid"></div>

<button id="save">주차 위치 저장</button>
</main>

<script>
let floorType="",floorNumber="",zone="",number="";
const el=id=>document.getElementById(id);

function create(id,values,callback){
 const box=el(id);
 values.forEach(value=>{
  const button=document.createElement("button");
  button.textContent=value;
  button.onclick=()=>{
   callback(value);
   if(id!=="keys"){
    [...box.children].forEach(b=>
     b.classList.toggle("active",b===button && (id!=="zones" || zone===value))
    );
   }
   update();
  };
  box.appendChild(button);
 });
}

create("floor-type",["지하","지상"],v=>floorType=v);
create("floors",["1","2","3","4","5","6","7"],v=>floorNumber=v);

create("zones",
 "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split(""),
 v=>zone=zone===v?"":v);

create("keys",
 ["1","2","3","4","5","6","7","8","9","←","0","초기화"],
 v=>{
  if(v==="초기화")number="";
  else if(v==="←")number=number.slice(0,-1);
  else if(number.length<2)number+=v;
 });

function formatPlace() {
 const parts = [];
 if (floorType && floorNumber) parts.push(floorType==="지하" ? "지하 "+floorNumber+"층" : "지상 "+floorNumber+"층");
 if (zone || number) parts.push(zone + (number ? number.padStart(2,"0") : ""));
 return parts.join(" · ");
}

function update(){
 el("preview").textContent = formatPlace() || "층을 선택하세요";
}

function load(){
 try{
  const data=JSON.parse(localStorage.getItem("parkpin"));
  if(data){
   el("last").textContent=data.place;
   el("time").textContent=data.time;
  }
 }catch(e){}
}

el("save").onclick=()=>{
 if(!floorType||!floorNumber){
  alert("지하/지상과 층 번호를 모두 선택하세요.");
  return;
 }
 const place=formatPlace();
 const time=new Date().toLocaleString("ko-KR");
 try{
  localStorage.setItem("parkpin",JSON.stringify({place,time}));
  load();
  alert("저장 완료: "+place);
 }catch(e){
  alert("현재 환경에서 저장할 수 없습니다.");
 }
};

load();
</script>
</body>
</html>
